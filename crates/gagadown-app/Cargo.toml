[package]
name = "gagadown-app"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "GagaDown"
path = "src/main.rs"

[dependencies]
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
anyhow = "1.0.104"
directories = "6.0.0"
eframe = { version = "0.36.2", default-features = false, features = ["wgpu", "default_fonts", "wayland", "x11"] }
egui-phosphor = "0.14"
gagadown-core = { version = "0.1.0", path = "../gagadown-core" }
parking_lot = "0.12.5"
rfd = "0.17.2"
png = "0.18"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "query"] }
tokio = { version = "1.53.2", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = "1.27.0"

[build-dependencies]
embed-resource = "3.0.11"

[target."cfg(windows)".dependencies]
tray-icon = "0.26"
raw-window-handle = "0.6"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_UI_Controls", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_System_Environment"] }
winreg = "0.56.0"
