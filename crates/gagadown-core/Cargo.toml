[package]
name = "gagadown-core"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
bytes = "1.12.1"
directories = "6.0.0"
fastrand = "2.5.0"
fs4 = "1.1.0"
futures-util = "0.3.34"
hex = "0.4.3"
httpdate = "1.0.3"
parking_lot = "0.12.5"
percent-encoding = "2.3.2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "socks", "http2", "system-proxy"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["full"] }
tokio-util = "0.7.19"
tower-http = { version = "0.7.1", features = ["cors"] }
tracing = "0.1.44"
trash = "5.2.9"
url = "2.5.8"
uuid = { version = "1.27.0", features = ["v4", "serde"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_IO", "Win32_System_Ioctl"] }

[dev-dependencies]
tempfile = "3.27.0"
tracing-subscriber = "0.3.23"
