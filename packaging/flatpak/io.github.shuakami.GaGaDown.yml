app-id: io.github.shuakami.GaGaDown
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: GagaDown
finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --device=dri
  - --share=network
  - --filesystem=xdg-download
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.kde.StatusNotifierWatcher
  # 内置更新器用 flatpak-spawn --host 调宿主的 flatpak install。
  - --talk-name=org.freedesktop.Flatpak
modules:
  - name: gagadown
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/gagadown/cargo
        AWS_LC_SYS_CMAKE_BUILDER: '1'
    build-commands:
      - cargo build --release --offline -j $(nproc) -p gagadown-app
      - install -D target/release/GagaDown /app/bin/GagaDown
      - install -D packaging/flatpak/io.github.shuakami.GaGaDown.desktop /app/share/applications/io.github.shuakami.GaGaDown.desktop
      - install -D packaging/flatpak/io.github.shuakami.GaGaDown.metainfo.xml /app/share/metainfo/io.github.shuakami.GaGaDown.metainfo.xml
      - install -D packaging/flatpak/io.github.shuakami.GaGaDown.png /app/share/icons/hicolor/512x512/apps/io.github.shuakami.GaGaDown.png
      - install -D packaging/flatpak/NotoSansCJK-LICENSE.txt /app/share/licenses/io.github.shuakami.GaGaDown/NotoSansCJK-LICENSE.txt
    # 直接构建仓库 checkout：包始终随当前代码走，不再需要
    # “旧 tag tarball + 大补丁”的投稿式流程。
    sources:
      - type: dir
        path: ../..
      - cargo-sources.json
