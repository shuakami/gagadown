name: Release

# main 每次推送自动发版：版本号取上一个 tag 的 patch + 1（没有 tag 时用 Cargo.toml 里的版本）
on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux keyring build dependency
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev
      - run: cargo test -p gagadown-core --features ci-test-keyring

  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Next version
        id: v
        run: |
          LAST=$(git tag -l 'v*' --sort=-v:refname | head -1)
          if [ -z "$LAST" ]; then
            V=$(grep -m1 '^version' crates/gagadown-app/Cargo.toml | cut -d'"' -f2)
          else
            IFS=. read -r MA MI PA <<< "${LAST#v}"
            V="$MA.$MI.$((PA + 1))"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "v$V"

  windows:
    needs: version
    runs-on: ubuntu-latest
    env:
      V: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: Set version
        run: bash tools/set-version.sh "$V"

      - name: Install toolchain
        run: |
          # Only the x64 target is shipped; avoid downloading both i686
          # variants and both threading runtimes from a slow mirror.
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends gcc-mingw-w64-x86-64-posix g++-mingw-w64-x86-64-posix nsis zip
          rustup target add x86_64-pc-windows-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          key: windows

      - name: Build
        run: bash tools/package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  linux:
    needs: version
    runs-on: ubuntu-22.04
    env:
      V: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: Set version
        run: bash tools/set-version.sh "$V"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev

      - uses: Swatinem/rust-cache@v2
        with:
          key: linux

      - name: Build
        run: |
          cargo build --release -p gagadown-app -p gagadown-cli
          D="GagaDown-$V-linux-x86_64"
          mkdir -p "dist/$D"
          cp target/release/GagaDown target/release/gagadown-cli "dist/$D/"
          cp assets/icon-source.png "dist/$D/gagadown.png"
          cp LICENSE "dist/$D/"
          tar -C dist -czf "dist/$D.tar.gz" "$D"
          rm -rf "dist/$D"

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  # Flatpak/Flathub 构建需要离线的 cargo 依赖清单；每个 release 附带一份
  # 与 tag 对应 Cargo.lock 生成的 cargo-sources.json，Flathub 仓库的
  # external-data-checker 按 release asset 自动跟进版本。
  flatpak-sources:
    needs: version
    runs-on: ubuntu-latest
    env:
      V: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: Set version
        run: bash tools/set-version.sh "$V"

      - name: Generate cargo-sources.json
        run: |
          python3 -m venv /tmp/fcg
          /tmp/fcg/bin/pip install -q aiohttp tomlkit
          curl -fsSL -o /tmp/flatpak-cargo-generator.py \
            https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/41c20aa10819cdb2a4f3ca171758a96d1955c018/cargo/flatpak-cargo-generator.py
          mkdir -p dist
          /tmp/fcg/bin/python /tmp/flatpak-cargo-generator.py Cargo.lock -o dist/cargo-sources.json

      - uses: actions/upload-artifact@v4
        with:
          name: flatpak-sources
          path: dist/cargo-sources.json

  # 自分发 Flatpak：直接构建仓库 checkout（manifest 的 dir source），
  # 单文件 .flatpak 进 release 资产，应用内更新器按资产名 *.flatpak 找它。
  flatpak:
    needs: version
    runs-on: ubuntu-latest
    env:
      V: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: Set version
        run: bash tools/set-version.sh "$V"

      - name: Install flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder

      - name: Add Flathub remote
        run: flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      # runtime/SDK 与构建缓存放进 cache，否则每次发版都要重拉 ~1GB。
      - uses: actions/cache@v4
        with:
          path: |
            .flatpak-builder
            repo
          key: flatpak-${{ runner.os }}-${{ hashFiles('packaging/flatpak/**', 'Cargo.lock') }}
          restore-keys: flatpak-${{ runner.os }}-

      # The platform/SDK install lives in the user flatpak dir, outside
      # .flatpak-builder; cache it separately so it survives Cargo.lock bumps.
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/flatpak
          key: flatpak-runtime-${{ runner.os }}-${{ hashFiles('packaging/flatpak/io.github.shuakami.GaGaDown.yml') }}
          restore-keys: flatpak-runtime-${{ runner.os }}-

      - name: Build bundle
        run: |
          flatpak-builder --user --install-deps-from=flathub --force-clean --disable-rofiles-fuse --repo=repo build-dir packaging/flatpak/io.github.shuakami.GaGaDown.yml
          mkdir -p dist
          flatpak build-bundle --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo repo "dist/GagaDown-$V-linux-x86_64.flatpak" io.github.shuakami.GaGaDown

      - uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: dist/*

  release:
    needs: [version, windows, linux, test, flatpak-sources, flatpak]
    runs-on: ubuntu-latest
    env:
      V: ${{ needs.version.outputs.version }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Stable file names
        run: |
          cd dist
          cp "GagaDown-Setup-$V.exe" GagaDown-windows-setup.exe
          cp "GagaDown-$V-linux-x86_64.tar.gz" GagaDown-linux-x86_64.tar.gz
          cp "GagaDown-$V-linux-x86_64.flatpak" GagaDown-linux-x86_64.flatpak
          ls -la

      - name: Write release notes
        run: |
          TAG="v$V"
          RAW="https://raw.githubusercontent.com/$REPO/main/docs"
          DL="https://github.com/$REPO/releases/download/$TAG"
          PREV=$(git tag -l 'v*' --sort=-v:refname | head -1)
          row() {
            SIZE=$(stat -c%s "dist/$1" | awk '{printf "%.1f", $1/1048576}')
            SHA=$(sha256sum "dist/$1" | cut -d' ' -f1)
            echo "<tr><td>$1</td><td>$2</td><td>${SIZE} MB</td><td><code>${SHA}</code></td></tr>"
          }
          {
            echo "<a href=\"$DL/GagaDown-Setup-$V.exe\"><img src=\"$RAW/download-windows.svg\" alt=\"Download for Windows\" /></a>"
            echo "<a href=\"$DL/GagaDown-$V-linux-x86_64.tar.gz\"><img src=\"$RAW/download-linux.svg\" alt=\"Download for Linux\" /></a>"
            echo
            echo "<details>"
            echo "<summary>文件</summary>"
            echo
            echo "<table>"
            echo "<tr><td>文件</td><td>说明</td><td>大小</td><td>SHA-256</td></tr>"
            row "GagaDown-Setup-$V.exe" "Windows 安装版"
            row "GagaDown-$V-portable.exe" "Windows 便携版"
            row "gagadown-cli-$V.exe" "Windows 命令行"
            row "GagaDown-$V-linux-x86_64.tar.gz" "Linux x86_64（桌面程序 + 命令行）"
            row "GagaDown-$V-linux-x86_64.flatpak" "Linux Flatpak 包"
            echo "</table>"
            echo "</details>"
            echo
            echo "### 变更"
            echo
            if [ -n "$PREV" ]; then
              git log --format='- %s (%h)' "$PREV..HEAD"
              echo
              echo "**Full Changelog**: [$PREV...$TAG](https://github.com/$REPO/compare/$PREV...$TAG)"
            else
              git log --format='- %s (%h)' HEAD
            fi
          } > release-notes.md
          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.V }}
          target_commitish: ${{ github.sha }}
          name: v${{ env.V }}
          body_path: release-notes.md
          files: |
            dist/GagaDown-Setup-${{ env.V }}.exe
            dist/GagaDown-${{ env.V }}-portable.exe
            dist/gagadown-cli-${{ env.V }}.exe
            dist/GagaDown-${{ env.V }}-linux-x86_64.tar.gz
            dist/GagaDown-${{ env.V }}-linux-x86_64.flatpak
            dist/GagaDown-${{ env.V }}-src.zip
            dist/GagaDown-windows-setup.exe
            dist/GagaDown-linux-x86_64.tar.gz
            dist/GagaDown-linux-x86_64.flatpak
            dist/cargo-sources.json
