name: Validate work branch

on:
  push:
    branches: [work/i18n-text-rendering]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalogs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tools/test-extension-i18n.cjs
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p gagadown-i18n

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p gagadown-app
      - run: cargo test -p gagadown-core

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
          components: clippy
      - name: Cross compiler and installer
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends gcc-mingw-w64-x86-64-posix g++-mingw-w64-x86-64-posix nsis zip
      - uses: Swatinem/rust-cache@v2
        with:
          key: validation-windows-gnu
      - run: cargo clippy --target x86_64-pc-windows-gnu -p gagadown-app
      - run: bash tools/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: validation-windows-${{ github.sha }}
          path: dist/*
