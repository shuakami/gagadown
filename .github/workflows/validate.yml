name: Validate work branch

on:
  push:
    branches: [work/i18n-text-rendering]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalogs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tools/test-extension-i18n.cjs
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p gagadown-i18n

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Desktop dependencies
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev xvfb mesa-vulkan-drivers
      - uses: Swatinem/rust-cache@v2
        with:
          key: validation-linux
      - run: cargo test -p gagadown-core -p gagadown-i18n
      - run: cargo build --release -p gagadown-app -p gagadown-cli
      - name: Isolated desktop runtime smoke test
        run: |
          export XDG_CONFIG_HOME="$RUNNER_TEMP/gagadown-smoke/config"
          export XDG_DATA_HOME="$RUNNER_TEMP/gagadown-smoke/data"
          export XDG_CACHE_HOME="$RUNNER_TEMP/gagadown-smoke/cache"
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/gagadown-smoke/runtime"
          mkdir -p "$XDG_CONFIG_HOME" "$XDG_DATA_HOME" "$XDG_CACHE_HOME" "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          set +e
          timeout --signal=TERM 20s xvfb-run -a target/release/GagaDown > "$RUNNER_TEMP/linux-runtime.log" 2>&1
          result=$?
          set -e
          test "$result" -eq 124
          ! grep -Ei 'panicked at|fatal error|failed to create' "$RUNNER_TEMP/linux-runtime.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-linux-${{ github.sha }}
          path: |
            target/release/GagaDown
            target/release/gagadown-cli
            ${{ runner.temp }}/linux-runtime.log

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p gagadown-app
      - run: cargo test -p gagadown-core

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
          components: clippy
      - name: Cross compiler and installer
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends gcc-mingw-w64-x86-64-posix g++-mingw-w64-x86-64-posix nsis zip
      - uses: Swatinem/rust-cache@v2
        with:
          key: validation-windows-gnu
      - run: cargo clippy --target x86_64-pc-windows-gnu -p gagadown-app
      - run: bash tools/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: validation-windows-${{ github.sha }}
          path: dist/*
